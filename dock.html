Loading Giveaway Roulette…
<script>
  /* Permanent link for the OBS dock. This page never changes, so it is safe for OBS to cache it:
     it asks version.json (never cached) for the newest build and opens that, every time. */
  (function(){
    var done=false;
    function go(v){ if(done) return; done=true; location.replace("wheel.html?view=dock&"+(v?"v="+encodeURIComponent(v):"t="+Date.now())); }
    setTimeout(function(){ go(""); },4000);
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){ go(j&&j.v); }).catch(function(){ go(""); });
  })();
</script>
</body>
